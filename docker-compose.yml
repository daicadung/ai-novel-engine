services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: novel_engine
      POSTGRES_USER: novel
      POSTGRES_PASSWORD: novel_dev_password
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U novel -d novel_engine"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: ane-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
volumes:
  postgres_data:
  redis_data:
